<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/premium-ui.css">
    <link rel="stylesheet" href="css/ui-polish.css"> <!-- Using your existing styles -->
    <style>
        /* Small custom styles for the table */
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .admin-table th, .admin-table td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        .admin-table th { background-color: #f8f9fa; color: #333; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-admin { background: #e3f2fd; color: #1976d2; }
        .badge-user { background: #f5f5f5; color: #616161; }
        .btn-promote { background: #4caf50; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-promote:hover { background: #45a049; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Main Content Area -->
        <main class="main-content" style="margin-left: 0; padding: 40px;">
            <div class="header-actions">
                <h1>User Management (Admin)</h1>
                <a href="dashboard.html" class="btn-secondary">← Back to Dashboard</a>
            </div>

            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userList">
                    <tr><td colspan="5">Loading users...</td></tr>
                </tbody>
            </table>
        </main>
    </div>

    <!-- Use your existing auth logic -->
    <script src="js/auth-guard.js"></script>
<script>
    const API_BASE_URL = "https://ai-customer-support-backend-pard.onrender.com";

    async function loadData() {
        window.SupportAIAuth.requireAuth(); // Safety check
        try {
            const response = await window.SupportAIAuth.authFetch(`${API_BASE_URL}/admin/users`);
            if (!response.ok) throw new Error(`Server responded with ${response.status}`);
            const users = await response.json();
            const tbody = document.getElementById('userList');
            if (!tbody) return;

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5">No users found</td></tr>';
                return;
            }

            tbody.innerHTML = users.map(u => `
                <tr>
                    <td>${u.name || 'User'}</td>
                    <td>${u.email}</td>
                    <td>${u.role || 'Support Agent'}</td>
                    <td>${u.is_admin ? '<b>Admin</b>' : 'Standard'}</td>
                    <td>
                        ${!u.is_admin ? `<button class="btn-promote" onclick="promote('${u.id}')">Promote</button>` : '---'}
                    </td>
                </tr>
            `).join('');
        } catch (e) {
            console.error(e);
            const tbody = document.getElementById('userList');
            if (tbody) tbody.innerHTML = '<tr><td colspan="5">Could not load users.</td></tr>';
        }
    }

    async function promote(id) {
        if(!confirm("Promote to Admin?")) return;
        await window.SupportAIAuth.authFetch(`${API_BASE_URL}/admin/users/${id}/role`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ is_admin: true, role: 'Administrator' })
        });
        loadData();
    }

    window.onload = loadData; // This fixes the "Loading..." issue
</script>
</body>
</html>
