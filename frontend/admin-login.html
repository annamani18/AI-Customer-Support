<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/premium-ui.css">

    <style>
        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
            font-family:'Inter',sans-serif;
            background:linear-gradient(135deg,#4F46E5,#7C3AED);
        }

        .admin-auth-card{
            background:rgba(255,255,255,.85);
            backdrop-filter:blur(20px) saturate(180%);
            -webkit-backdrop-filter:blur(20px) saturate(180%);
            padding:40px;
            border-radius:24px;
            box-shadow:0 25px 60px rgba(0,0,0,.25);
            width:100%;
            max-width:340px;
        }

        .admin-auth-icon{
            width:56px;
            height:56px;
            border-radius:16px;
            background:linear-gradient(135deg,#4F46E5,#7C3AED);
            display:flex;
            align-items:center;
            justify-content:center;
            margin:0 auto 16px;
            box-shadow:0 8px 20px rgba(79,70,229,.35);
        }

        .admin-auth-icon svg{
            width:26px;
            height:26px;
            color:#fff;
        }

        .admin-auth-card h2{
            text-align:center;
            color:#1E293B;
            margin:0 0 4px;
        }

        .admin-auth-subtitle{
            text-align:center;
            color:#64748B;
            font-size:13px;
            margin:0 0 24px;
        }

        .admin-auth-card input{
            width:100%;
            padding:13px 16px;
            margin:0 0 14px;
            border:2px solid #E2E8F0;
            border-radius:12px;
            font-size:14px;
            font-family:inherit;
            transition:.2s;
        }

        .admin-auth-card input:focus{
            outline:none;
            border-color:#4F46E5;
        }

        .admin-auth-card button[type="submit"]{
            width:100%;
            padding:13px;
            background:linear-gradient(135deg,#4F46E5,#7C3AED);
            color:white;
            border:none;
            border-radius:12px;
            font-weight:600;
            font-size:15px;
            cursor:pointer;
            transition:.2s;
        }

        .admin-auth-card button[type="submit"]:hover{
            transform:translateY(-2px);
            box-shadow:0 12px 25px rgba(79,70,229,.3);
        }
    </style>
</head>
<body>
    <div class="admin-auth-card">
        <div class="admin-auth-icon"><i data-lucide="shield"></i></div>
        <h2>Admin Portal</h2>
        <p class="admin-auth-subtitle">Sign in to manage the platform</p>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" required>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Password" required>
                <button type="button" class="toggle-password" data-target="password" aria-label="Show password" tabindex="-1">
                    <i data-lucide="eye"></i>
                </button>
            </div>
            <button type="submit">Login</button>
        </form>
        <p id="msg" style="color:#DC2626; text-align:center; font-size:14px; margin-top:14px;"></p>
    </div>

    <script src="js/auth-guard.js"></script>
    <script>
    const API_BASE_URL = "https://ai-customer-support-backend-pard.onrender.com";

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const emailField = document.getElementById('email').value;
        const passwordField = document.getElementById('password').value;
        const msg = document.getElementById('msg');
        msg.innerText = "";

        try {
            const res = await fetch(`${API_BASE_URL}/auth/admin/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: emailField, password: passwordField })
            });

            const data = await res.json();

            if (res.ok) {
                // Use the same session storage as every other page (login.html,
                // dashboard.html, etc.) so auth-guard.js recognizes this login
                // everywhere, not just on this one page.
                window.SupportAIAuth.setSession(data.access_token, emailField);
                window.location.href = 'admin-dashboard.html';
            } else {
                msg.innerText = data.detail || "Error logging in";
            }
        } catch (error) {
            console.error("Network error:", error);
            msg.innerText = "Could not reach the server. Please try again.";
        }
    });
    </script>
    <script src="js/password-toggle.js"></script>
    <script>
        if (window.lucide) window.lucide.createIcons();
    </script>
</body>
</html>
