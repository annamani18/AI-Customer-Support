<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | AI Customer Support Assistant</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/premium-ui.css">
    <link rel="stylesheet" href="css/ui-polish.css">

    <script src="https://unpkg.com/lucide@latest"></script>

<script src="js/auth-guard.js"></script>

    <link rel="stylesheet" href="css/premium-redesign.css">
</head>

<body>

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Top Navbar -->
        <header class="topbar">

            <div>
                <h1 id="welcomeMessage">Dashboard</h1>
                <p>Welcome back! Here's what's happening today.</p>
            </div>

            <div class="top-actions">

                <button class="icon-btn">
                    <i data-lucide="search"></i>
                </button>

                <button class="icon-btn">
                    <i data-lucide="bell"></i>
                </button>

                <button class="icon-btn">
                    <i data-lucide="moon"></i>
                </button>

                <div class="profile">
                    HM
                </div>

            </div>

        </header>

        <!-- Stats Cards -->
        <section class="stats-grid">

            <div class="stat-card">
                <h3>Today's Tickets</h3>
                <h2 id="statTicketsToday">—</h2>
                <span id="statTicketsTodayTag">Loading…</span>
            </div>

            <div class="stat-card">
                <h3>Resolved</h3>
                <h2 id="statResolved">—</h2>
                <span id="statResolvedTag">Loading…</span>
            </div>

            <div class="stat-card">
                <h3>Active Tickets</h3>
                <h2 id="statActive">—</h2>
                <span id="statActiveTag">Loading…</span>
            </div>

            <div class="stat-card">
                <h3>Escalated</h3>
                <h2 id="statEscalated">—</h2>
                <span id="statEscalatedTag">Loading…</span>
            </div>

        </section>

        <!-- Analytics -->
        <section class="dashboard-grid">

            <div class="chart-card">

                <h2>Analytics Overview</h2>

                <div class="chart-placeholder">
                    📈 Chart Coming Soon
                </div>

            </div>

            <div class="activity-card">

                <h2>Recent Activity</h2>

                <ul id="recentActivityList">

                    <li>Loading recent activity…</li>

                </ul>

            </div>

        </section>

    </main>

    <script>
        fetch("components/sidebar.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("sidebar-container").innerHTML = data;
                lucide.createIcons();
            });
    </script>

    <script src="js/dashboard.js"></script>

    <script src="js/mobile-nav.js"></script>

    <script src="js/nav-highlight.js"></script>

</body>

</html>
