<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tickets | AI Customer Support Assistant</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/tickets.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/premium-ui.css">
    <link rel="stylesheet" href="css/ui-polish.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

<script src="js/auth-guard.js"></script>

    <link rel="stylesheet" href="css/premium-redesign.css">
</head>

<body>

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <main class="tickets-page">
        <!-- ======================
     TOP NAVBAR
====================== -->

<header class="tickets-navbar">

    <div>

        <h1>Ticket Management</h1>

        <p>Monitor and manage customer support tickets.</p>

    </div>

    <div class="navbar-actions">

        <div class="search-box">

            <i data-lucide="search"></i>

            <input
                type="text"
                placeholder="Search tickets...">

        </div>

        <button class="icon-btn">

            <i data-lucide="bell"></i>

        </button>

        <button class="icon-btn">

            <i data-lucide="moon"></i>

        </button>

        <div class="profile">

            HM

        </div>

    </div>

</header>
<!-- ======================
     KPI CARDS
====================== -->

<section class="ticket-stats">

    <div class="ticket-card">

        <h3>Total Tickets</h3>

        <h2><span class="skeleton skeleton-text">—</span></h2>

    </div>

    <div class="ticket-card">

        <h3>Open</h3>

        <h2><span class="skeleton skeleton-text">—</span></h2>

    </div>

    <div class="ticket-card">

        <h3>Resolved</h3>

        <h2><span class="skeleton skeleton-text">—</span></h2>

    </div>

    <div class="ticket-card">

        <h3>Escalated</h3>

        <h2><span class="skeleton skeleton-text">—</span></h2>

    </div>

</section>
<!-- ======================
     FILTER BAR
====================== -->

<section class="filter-bar">

    <select>

        <option>Status</option>

        <option>Open</option>

        <option>Pending</option>

        <option>Resolved</option>

        <option>Escalated</option>

    </select>

    <select>

        <option>Priority</option>

        <option>High</option>

        <option>Medium</option>

        <option>Low</option>

    </select>

    <button class="create-ticket">

        <i data-lucide="plus"></i>

        Create Ticket

    </button>

</section>
<!-- ======================
     TICKET TABLE
====================== -->

<section class="ticket-table">

    <table>

        <thead>

            <tr>

                <th>Ticket ID</th>

                <th>Customer</th>

                <th>Issue</th>

                <th>Priority</th>

                <th>Status</th>

                <th>Assigned To</th>

                <th>Actions</th>

            </tr>

        </thead>

        <tbody>

            <tr>
                <td colspan="7" class="empty-state-cell">
                    <div class="empty-state">
                        <div class="skeleton skeleton-block" style="height:14px;width:60%;margin-bottom:8px;"></div>
                        <div class="skeleton skeleton-block" style="height:14px;width:40%;"></div>
                    </div>
                </td>
            </tr>

        </tbody>

    </table>

</section>

<!-- ======================
     CREATE TICKET MODAL (hidden by default)
====================== -->
<div id="createTicketModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:1000;">
    <div style="background:var(--bg-color,#fff); color:inherit; padding:24px; border-radius:8px; width:360px; max-width:90vw;">
        <h2 style="margin-top:0;">Create Ticket</h2>
        <form id="createTicketForm">
            <label style="display:block; margin-bottom:4px; font-size:14px;">Subject</label>
            <input type="text" id="ticketSubject" required style="width:100%; padding:8px; margin-bottom:12px; border:1px solid #ddd; border-radius:4px;">

            <label style="display:block; margin-bottom:4px; font-size:14px;">Description</label>
            <textarea id="ticketDescription" rows="3" style="width:100%; padding:8px; margin-bottom:12px; border:1px solid #ddd; border-radius:4px;"></textarea>

            <label style="display:block; margin-bottom:4px; font-size:14px;">Priority</label>
            <select id="ticketPriority" style="width:100%; padding:8px; margin-bottom:16px; border:1px solid #ddd; border-radius:4px;">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>

            <div style="display:flex; gap:8px; justify-content:flex-end;">
                <button type="button" id="cancelCreateTicket" style="padding:8px 16px; border:1px solid #ddd; border-radius:4px; background:#fff; cursor:pointer;">Cancel</button>
                <button type="submit" style="padding:8px 16px; border:none; border-radius:4px; background:#1a73e8; color:#fff; cursor:pointer;">Create</button>
            </div>
        </form>
    </div>
</div>
</main>

    <script>

        fetch("components/sidebar.html")
            .then(response => response.text())
            .then(data => {

                document.getElementById("sidebar-container").innerHTML = data;

                lucide.createIcons();

            });

    </script>

    <script src="js/tickets.js"></script>

    <script src="js/mobile-nav.js"></script>

    <script src="js/theme.js"></script>

    <script src="js/nav-highlight.js"></script>

</body>

</html>
